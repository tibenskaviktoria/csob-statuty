name: Aktualizácia štatútov

on:
  schedule:
    # denne o 5:00 UTC (7:00 SEČ / 6:00 SEČ podľa letného/zimného času)
    - cron: '0 5 * * *'
  workflow_dispatch: {}  # umožní ručné spustenie z GitHub UI (Actions tab -> Run workflow)

permissions:
  contents: write  # potrebné, aby workflow mohol commitnúť zmeny späť do repa

jobs:
  update-statuty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 1) Scrape the current state of the csob.sk
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u web_scraper/web_scraper.py

      - name: 2) Enrich only the new or changed statutes (using Anthropic API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u enrich_content/csob_statuty_enrich.py

      - name: Commit and push changes (if any)
        run: |
          git config user.name "statuty-bot"
          git config user.email "statuty-bot@users.noreply.github.com"
          git add web_scraper/statuty_raw.json enrich_content/statuty_enriched.json enrich_content/statuty_removed_log.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatic update of statutes ($(date -u +%Y-%m-%d))"
            git push
          fi
